volumes:
  minio-volume:
    driver: local
  pg-volume:
    driver: local

services:
  minio-tblrka: # Это сам S3 на MinIO
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=rootpass123
    volumes:
      - minio-volume:/data
    ports:
      - "9222:9000" # Оставил порты, чтобы руками можно было через клиент посмотреть
      - "9223:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3
  
  minio-init: # Инициализация двух бакетов raw и minilakehouse для того, чтобы при запуске не надо было каждый раз самому создавать руками
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio-tblrka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: 
    - |
      set -e
      mc alias set local http://minio-tblrka:9000 root rootpass123
      mc mb -p local/raw
      mc mb -p local/minilakehouse

  lakekeeper-db: # DB для Lakekeeper обычная PostgreSQL
    image: postgres:17
    volumes:
      - pg-volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pgpass123
      - POSTGRES_DB=lakekeeper_db
    ports:
      - 15432:5432 
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "--username=admin"]
      interval: 5s
      timeout: 3s
      retries: 3

  lakekeeper: # Сам Lakekeeper. Взял с их сайта, убрал ненужное по совету клодика
    image: &lakekeeper-image quay.io/lakekeeper/catalog:v0.13.4
    environment: &lakekeeper-environment
      - LAKEKEEPER__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://admin:pgpass123@lakekeeper-db:5432/lakekeeper_db
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://admin:pgpass123@lakekeeper-db:5432/lakekeeper_db
      - LAKEKEEPER__AUTHZ_BACKEND=allowall
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/lakekeeper", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 3s
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "18181:8181" # тоже оставил порт, чтобы руками смотреть

  migrate: # контейнер для создания нужной табличной структуры в бд для Lakekeeper
    image: *lakekeeper-image
    environment: *lakekeeper-environment
    restart: "no"
    command: [ "migrate" ]
    depends_on:
      lakekeeper-db:
        condition: service_healthy

  lakekeeper-init: # инициализация lakekeeper сразу же с warehouse. Логика, как с бакетами
    image: curlimages/curl:8.22.0
    restart: "no"
    volumes:
      - ./lakekeeper/warehouse.json:/warehouse.json:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      set -e
      base=http://lakekeeper:8181/management/v1

      code=$$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST "$$base/bootstrap" \
        -H "Content-Type: application/json" \
        -d '{"accept-terms-of-use": true}')
      echo "bootstrap: $$code"
      case "$$code" in
        200|204|400|409) ;;
        *) echo "bootstrap failed:"; cat /tmp/resp; echo; exit 1 ;;
      esac

      code=$$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST "$$base/warehouse" \
        -H "Content-Type: application/json" \
        -d @/warehouse.json)
      echo "warehouse: $$code"
      case "$$code" in
        200|201) ;;
        400|409) echo "warehouse already exists (or rejected):"; cat /tmp/resp; echo ;;
        *) echo "warehouse failed:"; cat /tmp/resp; echo; exit 1 ;;
      esac
